<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보드 · 같은 문서, 두 분석가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="board">
  <header class="b-top">
    <span class="brand">같은 문서, 두 분석가</span>
    <span class="badge" id="phaseBadge">…</span>
    <span class="clock" id="clock"></span>
    <span class="count" id="count"></span>
  </header>
  <nav class="b-tabs" id="tabs" aria-label="보기" hidden></nav>
  <main class="b-wrap" id="main"></main>
  <aside class="corner-qr" id="corner" hidden>
    <div class="qr" id="qrSmall"></div>
    <div>늦게 왔다면 여기로</div>
  </aside>
  <script type="module" src="/assets/board.js"></script>
</body>
</html>

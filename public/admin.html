<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>발표자 · 같은 문서, 두 분석가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="admin">
  <header class="top" id="top">
    <div class="in top-in">
      <span class="brand">발표자 화면</span>
      <span class="badge" id="phaseBadge">…</span>
      <span class="clock" id="clock"></span>
      <span class="who" id="who"></span>
    </div>
  </header>
  <main class="layout-admin">
    <section class="card" id="login" hidden>
      <div class="kicker">발표자 코드</div>
      <h2>Vercel에 넣은 ADMIN_CODE를 입력하세요</h2>
      <form class="row" id="loginForm">
        <div style="flex:1;min-width:180px"><input type="password" id="code" autocomplete="current-password" aria-label="발표자 코드"></div>
        <button class="btn" type="submit" id="loginBtn">들어가기</button>
      </form>
      <p class="err" id="loginErr" hidden></p>
    </section>
    <div id="panel" class="stack" hidden>
      <section class="card"><div class="status" id="status"></div></section>
      <section class="card" id="runCard"></section>
      <section class="card" id="peopleCard"></section>
      <section class="card" id="docCard"></section>
      <section class="card" id="setCard"></section>
      <section class="card" id="linkCard"></section>
      <section class="card" id="dataCard"></section>
    </div>
  </main>
  <script type="module" src="/assets/admin.js"></script>
</body>
</html>
